# ==========================================
# PROFILE CONFIGURATION
# ==========================================
# Defines which profile will be active by default (dev, test, prd)
spring.profiles.active = prd

# ==========================================
# APPLICATION CONFIGURATIONS
# ==========================================
# Basic application configurations
application.time = 1
application.name = maps
application.server = 0.0.0.0
application.port = ${PORT:8080}
application.version = v1

# CORS configurations - allowed domains for cross-origin access
application.cors = http://localhost:5173, http://localhost:5174, http://localhost:10000, https://maps.chm.mb, https://www.maps.chm.mb

# ==========================================
# JWT CONFIGURATIONS (AUTHENTICATION)
# ==========================================
# JWT token configurations for authentication
application.jwtIssuer = ${JWT_ISSUER:maps}
application.jwtSecret = ${JWT_SECRET:QkY5hP9Z6NccHmn4JtHnJHV2sW0ByiVZPChSmZ8fWvXh1eHrc5oPPlgI9YvEUGwWJp+1vIRhUBO6vIVHTAUn6A==}
application.jwtAudience = ${JWT_AUDIENCE:https://audience}
application.jwtExpiration = ${JWT_EXPIRATION:14400000}
application.refresh = ${JWT_REFRESH:86400000}

# ==========================================
# OPENAPI/SWAGGER CONFIGURATIONS
# ==========================================
# API documentation URLs for different environments
maps.openapi.dev-url = http://${application.server}:${application.port}/${application.name}/${application.version}
maps.openapi.prd-url = http://${application.server}:${application.port}/${application.name}/${application.version}

# ==========================================
# SERVER CONFIGURATIONS
# ==========================================
# Basic Spring Boot server configurations
spring.application.name = ${application.name}
server.servlet.context-path = /${application.name}/${application.version}
server.address = 0.0.0.0
server.port = ${PORT:8080}

# ==========================================
# INTERNATIONALIZATION CONFIGURATIONS
# ==========================================
# Message and encoding configurations
spring.messages.basename = ValidationMessages
spring.messages.encoding = UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==========================================
# GENERAL SPRING CONFIGURATIONS
# ==========================================
# Miscellaneous Spring Boot configurations
spring.output.ansi.enabled = ALWAYS
spring.sql.init.mode=always

# ==========================================
# LOGGING CONFIGURATIONS
# ==========================================
# Application logging configurations
logging.file.max-size = 5MB
logging.file.max-history = 100
logging.file.total-size-cap = 500MB
logging.file.name = ${logging.file.path}/${application.name}.log
logging.file.path = /opt/${application.name}/logs
logging.pattern.dateformat = dd/MM/yy HH:mm:ss
logging.pattern.console = %clr(%d{yyyy-MM-dd HH:mm:ss}){magenta} - %msg%n
logging.level.root = INFO
logging.level.org.springframework.web = debug
logging.level.org.hibernate = WARN
logging.threshold.console = TRACE
logging.threshold.file = INFO

# ==========================================
# MONITORING CONFIGURATIONS (ACTUATOR)
# ==========================================
# Exposed endpoints for application monitoring
management.endpoints.web.exposure.include = health, info, metrics
management.endpoints.web.exposure.exclude = env, beans, configprops, dump, heapdump, threaddump, prometheus
management.endpoint.health.show-details = when-authorized
management.endpoint.health.roles = ADMIN
management.endpoint.info.enabled = true
management.metrics.enable.hikari=true
management.info.env.enabled = false
management.info.java.enabled = true
management.info.os.enabled = false

# ==========================================
# ADVANCED SPRING CONFIGURATIONS
# ==========================================
# Specific Spring behavior configurations
spring.main.allow-circular-references = false
spring.main.allow-bean-definition-overriding = true

# ==========================================
# UPLOAD AND RATE LIMITING CONFIGURATIONS
# ==========================================
# File upload and rate limiting configurations
spring.servlet.multipart.max-file-size = 1028MB
spring.servlet.multipart.max-request-size = 1028MB
rate.limit.requests=${RATE_LIMIT_REQUESTS:50}
rate.limit.cleanup.interval=${RATE_LIMIT_CLEANUP_INTERVAL:15}
rate.limit.burst.multiplier=${RATE_LIMIT_BURST_MULTIPLIER:2}

# ==========================================
# EMAIL CONFIGURATIONS
# ==========================================
# Email service configurations (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:gadelha.ti@gmail.com}
spring.mail.password=${MAIL_PASSWORD:fhlm cmyc nwhc tbwn}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# RECAPTCHA CONFIGURATIONS
# ==========================================
# Google reCAPTCHA configurations for validation
recaptcha.site=${RECAPTCHA_SITE:default_site_key}
recaptcha.secret=${RECAPTCHA_SECRET:default_secret_key}
recaptcha.url=${RECAPTCHA_URL:https://www.google.com/recaptcha/api/siteverify}

# ==========================================
# SERIALIZATION AND JPA CONFIGURATIONS
# ==========================================
# Specific JSON serialization and JPA configurations
spring.jackson.serialization.fail-on-empty-beans = true
spring.jpa.properties.hibernate.max_fetch_depth=5

# ==========================================
# SECURITY CONFIGURATIONS
# ==========================================
# Enhanced security settings
security.csrf.enabled=true
security.csrf.cookie.http-only=false
security.csrf.cookie.secure=false
security.csrf.cookie.same-site=Lax
security.csrf.ignore.patterns=/api/**,/auth/**,/actuator/**

security.csp.enabled=true
security.hsts.enabled=true
security.headers.frame-options=DENY
security.headers.content-type-options=nosniff

# ==========================================
# CONNECTION POOL OPTIMIZATION
# ==========================================
# Resource utilization and resilience of database access

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000