# ==========================================
# PROFILE CONFIGURATION
# ==========================================
# Defines which profile will be active by default (dev, test, prd)
spring.profiles.active = dev

# ==========================================
# APPLICATION CONFIGURATIONS
# ==========================================
# Basic application configurations
application.time = 1
application.name = maps
application.server = 0.0.0.0
application.port = ${PORT:8080}
application.version = v1

# CORS configurations - allowed domains for cross-origin access
application.cors = http://localhost:5173, http://localhost:5174, http://localhost:10000, https://maps.chm.mb, https://www.maps.chm.mb

# ==========================================
# JWT CONFIGURATIONS (AUTHENTICATION)
# ==========================================
# JWT token configurations for authentication
application.jwtIssuer = maps
application.jwtSecret = QkY5hP9Z6NccHmn4JtHnJHV2sW0ByiVZPChSmZ8fWvXh1eHrc5oPPlgI9YvEUGwWJp+1vIRhUBO6vIVHTAUn6A==
application.jwtAudience = https://audience
application.jwtExpiration = 14400000
application.refresh = 86400000

# ==========================================
# OPENAPI/SWAGGER CONFIGURATIONS
# ==========================================
# API documentation URLs for different environments
maps.openapi.dev-url = http://${application.server}:${application.port}/${application.name}/${application.version}
maps.openapi.prd-url = http://${application.server}:${application.port}/${application.name}/${application.version}

# ==========================================
# SERVER CONFIGURATIONS
# ==========================================
# Basic Spring Boot server configurations
spring.application.name = ${application.name}
server.servlet.context-path = /${application.name}/${application.version}
server.address = 0.0.0.0
server.port = ${PORT:8080}

# ==========================================
# INTERNATIONALIZATION CONFIGURATIONS
# ==========================================
# Message and encoding configurations
spring.messages.basename = ValidationMessages
spring.messages.encoding = UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==========================================
# GENERAL SPRING CONFIGURATIONS
# ==========================================
# Miscellaneous Spring Boot configurations
spring.output.ansi.enabled = ALWAYS
spring.sql.init.mode=always

# ==========================================
# LOGGING CONFIGURATIONS
# ==========================================
# Application logging configurations
logging.file.max-size = 5MB
logging.file.max-history = 100
logging.file.total-size-cap = 500MB
logging.file.name = ${logging.file.path}/${application.name}.log
logging.file.path = /opt/${application.name}/logs
logging.pattern.dateformat = dd/MM/yy HH:mm:ss
logging.pattern.console = %clr(%d{yyyy-MM-dd HH:mm:ss}){magenta} - %msg%n
logging.level.root = INFO
logging.level.org.springframework.web = debug
logging.level.org.hibernate = error
logging.threshold.console = TRACE
logging.threshold.file = INFO

# ==========================================
# MONITORING CONFIGURATIONS (ACTUATOR)
# ==========================================
# Exposed endpoints for application monitoring
management.endpoints.web.exposure.include = health, info
management.endpoints.web.exposure.exclude = env, beans

# ==========================================
# ADVANCED SPRING CONFIGURATIONS
# ==========================================
# Specific Spring behavior configurations
spring.main.allow-circular-references = false
spring.main.allow-bean-definition-overriding = true

# ==========================================
# UPLOAD AND RATE LIMITING CONFIGURATIONS
# ==========================================
# File upload and rate limiting configurations
spring.servlet.multipart.max-file-size = 1028MB
spring.servlet.multipart.max-request-size = 1028MB
rate.limit.requests=100
rate.limit.cleanup.interval=15
rate.limit.burst.multiplier=2

