# ==========================================
# PRODUCTION ENVIRONMENT CONFIGURATIONS
# ==========================================
# Specific profile for production
# This profile is used when the application runs in production environment

# ==========================================
# DATABASE CONFIGURATIONS - LOCAL POSTGRESQL
# ==========================================
# Configurations for local PostgreSQL database connection
# Used for development and local testing
spring.datasource.url = jdbc:postgresql://localhost:5432/maps
spring.datasource.username = postgres
spring.datasource.password = G@delha
spring.datasource.platform = postgres
spring.datasource.driver-class-name = org.postgresql.Driver

# ==========================================
# HIBERNATE/JPA CONFIGURATIONS - PRODUCTION
# ==========================================
# Hibernate configurations optimized for production
# DDL-AUTO = update: updates schema without losing data
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.properties.hibernate.dialect = org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.properties.hibernate.default_schema = maps
spring.jpa.show-sql = false
#spring.jpa.open-in-view=false

# ==========================================
# PRODUCTION SECURITY CONFIGURATIONS
# ==========================================
# Strict security settings for production
security.csrf.enabled=true
security.csrf.cookie.http-only=true
security.csrf.cookie.secure=true
security.csrf.cookie.same-site=Strict
security.csrf.ignore.patterns=/api/**,/auth/**,/actuator/health,/actuator/info

# Rate limiting more restrictive in production
rate.limit.requests=30
rate.limit.cleanup.interval=10
rate.limit.burst.multiplier=1

# HTTPS enforcement in production
server.ssl.enabled=${SSL_ENABLED:false}
security.require-ssl=${REQUIRE_SSL:false}

# ==========================================
# MONITORING CONFIGURATIONS (ACTUATOR)
# ==========================================
# Exposed endpoints for application monitoring
management.tracing.sampling.probability=0.1