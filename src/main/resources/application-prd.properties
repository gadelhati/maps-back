# Specific PostgreSQL configurations for production
spring.datasource.platform = postgres
spring.datasource.driver-class-name = org.postgresql.Driver

# ==========================================
# HIBERNATE/JPA CONFIGURATIONS - PRODUCTION
# ==========================================
# Hibernate configurations optimized for production
# DDL-AUTO = update: updates schema without losing data
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.dialect = org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.properties.hibernate.default_schema = maps
spring.jpa.show-sql = false
