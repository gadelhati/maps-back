# ==========================================
# DEVELOPMENT ENVIRONMENT CONFIGURATIONS
# ==========================================
# Specific profile for local development
# This profile is used during application development

# ==========================================
# DATABASE CONFIGURATIONS - LOCAL POSTGRESQL
# ==========================================
# Configurations for local PostgreSQL database connection
# Used for development and local testing
spring.datasource.url = jdbc:postgresql://localhost:5432/maps
spring.datasource.username = postgres
spring.datasource.password = G@delha
spring.datasource.platform = postgres
spring.datasource.driver-class-name = org.postgresql.Driver

# ==========================================
# HIBERNATE/JPA CONFIGURATIONS - DEVELOPMENT
# ==========================================
# Hibernate configurations optimized for development
# DDL-AUTO = create: recreates database on each startup (careful in production!)
spring.jpa.hibernate.ddl-auto = create
spring.jpa.properties.hibernate.dialect = org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
spring.jpa.properties.hibernate.default_schema = maps
spring.jpa.show-sql = true

# ==========================================
# DEVELOPMENT SECURITY CONFIGURATIONS
# ==========================================
# Relaxed security settings for development
security.csrf.enabled=false
security.csrf.cookie.http-only=false
security.csrf.cookie.secure=false
security.csrf.cookie.same-site=None
security.csrf.ignore.patterns=/api/**,/auth/**,/actuator/**,/h2-console/**

# Rate limiting more permissive in development
rate.limit.requests=200
rate.limit.cleanup.interval=30
rate.limit.burst.multiplier=3