# ==========================================
# TEST ENVIRONMENT CONFIGURATIONS
# ==========================================
# Specific profile for automated testing
# This profile is used during unit and integration tests

# ==========================================
# DATABASE CONFIGURATIONS - H2 IN-MEMORY
# ==========================================
# Configurations for H2 in-memory database for testing
# Database is created and destroyed with each test execution
spring.datasource.url = jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;INIT=CREATE SCHEMA IF NOT EXISTS maps
spring.datasource.driverClassName = org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = 

# ==========================================
# HIBERNATE/JPA CONFIGURATIONS - TESTING
# ==========================================
# Hibernate configurations optimized for testing
# DDL-AUTO = create-drop: creates schema at start and drops at end
spring.jpa.database-platform = org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto = create-drop
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema = maps
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.show-sql = false
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces = true
spring.jpa.defer-datasource-initialization = false
spring.sql.init.mode = never

# ==========================================
# TEST SECURITY CONFIGURATIONS
# ==========================================
# Minimal security for testing (fast and predictable)
security.csrf.enabled=false
security.csrf.cookie.http-only=false
security.csrf.cookie.secure=false
security.csrf.cookie.same-site=None
security.csrf.ignore.patterns=/**

# Rate limiting disabled for testing
rate.limit.requests=1000
rate.limit.cleanup.interval=60
rate.limit.burst.multiplier=10

# ==========================================
# ENCRYPTION CONFIGURATIONS - TESTING
# ==========================================
# Test encryption key (NEVER use in production)
app.encryption.secret=testSecretKey123456789012345678901234567890