# Test Configuration for Maps Backend
# Enhanced test properties for comprehensive testing coverage

# Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Cache Configuration for Tests
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=30m
spring.cache.cache-names=roles,permissions

# Security Configuration for Tests
jwt.secret=testSecretKeyForJWTTokenGenerationInTestEnvironmentOnly12345
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Email Configuration for Tests (Disabled)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Recaptcha Configuration for Tests (Mock)
google.recaptcha.secret=test-secret-key
google.recaptcha.site-key=test-site-key
google.recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# Rate Limiting Configuration for Tests
bucket4j.enabled=false

# Logging Configuration for Tests
logging.level.com.maps=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.cache=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Actuator Configuration for Tests
management.endpoints.web.exposure.include=health,info,metrics,cache
management.endpoint.health.show-details=always

# Test-specific Properties
test.data.cleanup.enabled=true
test.performance.enabled=true
test.security.strict=false

# Caffeine Cache Test Configuration
cache.test.roles.max-size=100
cache.test.roles.expire-after-write=1h
cache.test.permissions.max-size=100
cache.test.permissions.expire-after-write=1h

# TOTP Configuration for Tests
totp.secret.length=32
totp.window.size=3
totp.code.digits=6

# File Upload Test Configuration
file.upload.max-size=1MB
file.upload.allowed-types=jpg,png,gif,pdf

# Internationalization for Tests
spring.messages.basename=ValidationMessages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600